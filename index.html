<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070605" />
<title>열전</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f0c09'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='6' fill='none' stroke='%238a6a2a'/%3E%3Ctext x='16' y='24' font-size='17' font-weight='700' text-anchor='middle' fill='%23d8ae57'%3E%EC%97%B4%3C/text%3E%3C/svg%3E" />

<style>:root{
  
  --bg:#070605; --s1:#0f0c09; --s2:#171310; --s3:#221b14; --s4:#2e251b;
  --line:#2c2419; --line2:#473a2a;
  --ink:#f3ede2; --dim:#9c8f7d; --dim2:#6e6458;
  --gold:#d8ae57; --gold2:#f5dc93; --gold3:#8a6a2a;
  --red:#c25a3f; --green:#7aa05f; --blue:#7fa8c4; --purple:#b07fd0;
  --r1:6px; --r2:10px; --r3:16px;
  
  --inset:inset 0 1px 0 rgba(245,220,147,.06), inset 0 0 44px rgba(0,0,0,.55);
  --lift:0 10px 30px rgba(0,0,0,.5);
  --hud-h:56px; --nav-h:78px;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);min-height:100vh;
  font:14px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%;
  
  background:
    radial-gradient(1400px 620px at 50% -240px,#2a2117 0%,transparent 68%),
    radial-gradient(900px 900px at 90% 110%,#171a20 0%,transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
.page{max-width:1720px;margin-inline:auto;padding:0 clamp(12px,2.2vw,32px)}
body.chrome{padding-bottom:var(--nav-h)}
button{
  background:linear-gradient(180deg,var(--s4),var(--s2));color:var(--ink);
  border:1px solid var(--line2);border-radius:var(--r1);padding:7px 15px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.02em;
  box-shadow:inset 0 1px 0 rgba(245,220,147,.07);
  transition:border-color .12s,background .12s,transform .06s,box-shadow .12s;
}
button:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#3a301f,#241d15)}
button:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.55)}
button:disabled{opacity:.3;cursor:default}
button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;
          border-color:var(--gold2);box-shadow:0 0 14px rgba(216,174,87,.3)}
button em{font-style:normal;color:var(--dim);font-size:11px;margin-left:6px}
button.on em{color:#5a4718}
button.mini{padding:3px 9px;font-size:11px;border-radius:14px}
.cta{background:linear-gradient(180deg,var(--gold2),#b8862f);color:#1a1408;
     border-color:var(--gold2);font-weight:800;letter-spacing:.12em;
     box-shadow:0 0 22px rgba(216,174,87,.32),inset 0 1px 0 rgba(255,255,255,.45)}
.cta:hover:not(:disabled){background:linear-gradient(180deg,#fff0bd,#c9942f);border-color:#fff0bd}
h2{font-size:16px;margin:0 0 4px;letter-spacing:.05em;font-weight:700}
h2 small{color:var(--dim);font-weight:400;margin-left:8px;font-size:11px}
.cintro{color:var(--dim);font-size:12px;margin:0 0 12px}
.sp{flex:1}
.lab{color:var(--dim);font-size:10.5px;letter-spacing:.16em;font-weight:700}
.big{font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;
      color:var(--c,var(--dim));border:1px solid var(--c,var(--line));border-radius:5px;
      padding:1px 6px;margin:0 3px 3px 0;background:rgba(0,0,0,.4);
      box-shadow:inset 0 0 10px rgba(0,0,0,.5)}
.chip.boss{box-shadow:0 0 0 1px var(--c) inset,0 0 10px rgba(194,90,63,.4);font-weight:800}
.screen{display:none}
.screen.on{display:block;animation:screenIn .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen.on{animation:none}
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
#cover.on{position:relative;min-height:100dvh;display:flex;flex-direction:column;
          justify-content:space-between;align-items:center;padding:6vh clamp(12px,2.2vw,32px) 4vh}
#coverArt{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#cover.on::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 45%,transparent 30%,rgba(7,6,5,.82) 100%)}
.coverInk{position:relative;z-index:1;text-align:center;
          text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 40px rgba(0,0,0,.85)}
.coverInk .introLine{margin:0}
.noticeBox{position:relative;z-index:1;width:min(560px,100%);
           background:linear-gradient(168deg,rgba(23,19,16,.94),rgba(15,12,9,.96));
           border:1px solid var(--line2);border-radius:var(--r3);
           padding:18px 20px 20px;backdrop-filter:blur(6px);
           box-shadow:var(--inset),0 20px 50px rgba(0,0,0,.6)}
.noticeHead{font-size:11px;letter-spacing:.24em;font-weight:800;color:var(--gold);
            border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.noticeList{max-height:32vh;overflow:auto}
.nt{padding:9px 0;border-bottom:1px dashed var(--line)}
.nt:last-child{border-bottom:none}
.nt b{font-size:13.5px}
.nt i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.12em;
      color:var(--gold);border:1px solid var(--line2);border-radius:4px;
      padding:1px 5px;margin-right:7px;background:rgba(0,0,0,.4)}
.nt p{margin:4px 0 0;font-size:12px;color:var(--dim);line-height:1.65}
#coverGo{width:100%;margin-top:14px;padding:14px;font-size:15px}
#loading.on{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.loadBox{width:min(420px,100%);text-align:center;padding:0 20px}
.loadSeal{font-size:44px;font-weight:900;color:var(--gold);
          opacity:.24;letter-spacing:.34em;text-indent:.34em;margin-bottom:18px;
          animation:sealPulse 2.4s ease-in-out infinite}
@keyframes sealPulse{0%,100%{opacity:.16}50%{opacity:.34}}
.loadName{font-size:12px;color:var(--dim);letter-spacing:.16em;margin-bottom:10px;min-height:20px}
.loadBar{height:7px;border-radius:4px;background:#17120c;border:1px solid var(--line2);
         overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.loadBar i{display:block;height:100%;width:0;transition:width .12s linear;
           background:linear-gradient(90deg,var(--gold3),var(--gold2));
           box-shadow:0 0 12px rgba(216,174,87,.6)}
.loadPct{margin-top:9px;font-size:11.5px;color:var(--gold);letter-spacing:.1em;
         font-variant-numeric:tabular-nums}
#intro.on{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.introBox{text-align:center}
.introLogo{font-size:clamp(38px,5vw,52px);font-weight:900;letter-spacing:.28em;margin:0 0 6px;
      background:linear-gradient(180deg,#fdf0c8,#f5dc93 38%,#b8862f);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 3px 10px rgba(216,174,87,.28))}
.introLine{color:var(--dim);font-size:13px;margin:0 0 30px;letter-spacing:.08em}
.introMsg{color:var(--gold);font-size:13px;margin:26px 0 14px;letter-spacing:.08em;min-height:20px}
#introGo{padding:14px 44px;font-size:15px}
.flipRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;perspective:1200px}
.flip{width:170px;height:248px}
.flip.king{transform:scale(1.06)}
.flipInner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
           transform:rotateY(180deg) translateY(26px);opacity:0;
           transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s}
.flip.shown .flipInner{transform:rotateY(0) translateY(0);opacity:1}
.flipBack,.flipFront{position:absolute;inset:0;backface-visibility:hidden;
                     border-radius:12px;overflow:hidden}
.flipBack{transform:rotateY(180deg);border:1.8px solid var(--line2);
          background:repeating-linear-gradient(45deg,#1c1710,#1c1710 8px,#241d13 8px,#241d13 16px);
          display:flex;align-items:center;justify-content:center}
.flipBack span{font-size:48px;font-weight:900;color:rgba(216,174,87,.28)}
.flipFront{transform:rotateY(0)}
.flip.glow .flipFront{box-shadow:0 0 30px rgba(240,216,120,.6);border-radius:12px}
.top{position:sticky;top:0;z-index:15;margin-bottom:14px;
     background:linear-gradient(180deg,rgba(12,10,8,.97) 60%,rgba(12,10,8,.82));
     backdrop-filter:blur(8px);
     border-bottom:1px solid var(--line2);
     box-shadow:0 1px 0 rgba(216,174,87,.22),0 10px 28px rgba(0,0,0,.55)}
.topIn{max-width:1720px;margin-inline:auto;height:var(--hud-h);
       padding:0 clamp(12px,2.2vw,32px);
       display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:800;letter-spacing:.14em;
       background:linear-gradient(180deg,#fdf0c8,#c9992f);
       -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.res{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
.rz{display:flex;gap:8px;align-items:center;padding:4px 12px 4px 4px;border-radius:22px;
    background:linear-gradient(180deg,var(--s3),var(--s1));border:1px solid var(--line2);
    box-shadow:var(--inset)}
.rz i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
      font-style:normal;font-family:serif;font-size:12px;font-weight:900;
      color:var(--c,var(--gold));background:radial-gradient(circle at 35% 30%,#2b2318,#100d09);
      border:1px solid var(--c,var(--gold3));box-shadow:0 0 10px rgba(0,0,0,.6)}
.rz b{font-size:15px;color:var(--c,var(--gold));font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rz span{color:var(--dim2);font-size:9.5px;letter-spacing:.14em;font-weight:700}
.rz.bump b{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1);color:var(--gold2)}40%{transform:scale(1.35);color:#fff3ce}
                100%{transform:scale(1)}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;
     background:linear-gradient(0deg,#0a0806 30%,rgba(10,8,6,.9));
     border-top:1px solid var(--line2);backdrop-filter:blur(10px);
     box-shadow:0 -1px 0 rgba(216,174,87,.2),0 -14px 40px rgba(0,0,0,.7)}
.navIn{max-width:1720px;margin-inline:auto;display:flex;gap:8px;align-items:stretch;
       padding:8px clamp(12px,2.2vw,32px) calc(8px + env(safe-area-inset-bottom,0px))}
.nbtn{position:relative;flex:1;min-width:0;padding:6px 6px 7px;border-radius:12px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
      background:linear-gradient(180deg,rgba(46,37,27,.5),rgba(15,12,9,.6));
      border:1px solid var(--line);overflow:hidden}
.nbtn{padding:10px 8px 11px}
.nbtn .nn{font-size:16px;font-weight:800;letter-spacing:.1em;line-height:1.25;
          color:var(--a,var(--gold));
          text-shadow:0 0 14px color-mix(in srgb,var(--a,var(--gold)) 40%,transparent)}
.nbtn .nc{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.nbtn.on{border-color:var(--a,var(--gold));
         background:linear-gradient(180deg,color-mix(in srgb,var(--a,var(--gold)) 22%,transparent),rgba(15,12,9,.7));
         box-shadow:0 0 18px color-mix(in srgb,var(--a,var(--gold)) 26%,transparent),
                    inset 0 1px 0 rgba(255,255,255,.12)}
.nbtn.on .nn{color:#fff6dd;text-shadow:0 0 16px color-mix(in srgb,var(--a,var(--gold)) 70%,transparent)}
.nbtn.on .nc{color:var(--ink)}
.nbtn .ndot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;
            background:var(--gold2);box-shadow:0 0 8px var(--gold2);
            animation:dot 1.6s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.nbtn.sortie{flex:1.6;background:linear-gradient(180deg,#4a3818,#231a0c);border-color:var(--gold3)}
.nbtn.sortie .nn{color:var(--gold2)}
.nbtn.sortie .nc{color:var(--gold)}
.nbtn.sortie:hover:not(:disabled){border-color:var(--gold2);
  box-shadow:0 0 22px rgba(216,174,87,.35)}
.home{position:relative}
.stage{position:relative;overflow:hidden;border-radius:var(--r3);
       border:1px solid var(--line2);
       background:radial-gradient(120% 80% at 50% 6%,#1a1d24 0%,#0b0a08 74%);
       box-shadow:var(--inset),var(--lift);
       
       height:calc(100vh - var(--hud-h) - var(--nav-h) - 74px);
       height:calc(100dvh - var(--hud-h) - var(--nav-h) - 74px);
       min-height:380px}
.stage canvas{position:absolute;inset:0;display:block}
.stage::after{content:'';position:absolute;inset:12px;pointer-events:none;z-index:1;
  --g:linear-gradient(var(--gold),var(--gold));opacity:.4;
  background:
    var(--g) left top/22px 1.5px no-repeat, var(--g) left top/1.5px 22px no-repeat,
    var(--g) right top/22px 1.5px no-repeat, var(--g) right top/1.5px 22px no-repeat,
    var(--g) left bottom/22px 1.5px no-repeat, var(--g) left bottom/1.5px 22px no-repeat,
    var(--g) right bottom/22px 1.5px no-repeat, var(--g) right bottom/1.5px 22px no-repeat}
.stagePlate{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:2;
  text-align:center;pointer-events:none;
  text-shadow:0 2px 14px rgba(0,0,0,.9)}
.stagePlate b{display:block;font-size:20px;font-weight:900;
  letter-spacing:.36em;color:var(--gold);text-indent:.36em}
.stagePlate span{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--dim2);margin-top:2px}
.stageOver{position:absolute;left:0;right:0;bottom:0;padding:0 18px 16px;text-align:center;z-index:2}
.troupeNames{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:7px}
.tn{font-size:12.5px;font-weight:700;color:var(--ink);
    background:linear-gradient(180deg,rgba(34,27,20,.86),rgba(8,8,7,.8));
    border:1px solid var(--line2);border-radius:20px;padding:4px 12px;
    backdrop-filter:blur(3px);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.tn em{font-style:normal;color:var(--dim);font-size:10px;margin-left:4px}
.tn.lead{color:var(--gold2);border-color:var(--gold);
         box-shadow:0 0 16px rgba(216,174,87,.3),0 4px 14px rgba(0,0,0,.5)}
.tn.empty{color:#5d5449;border-style:dashed;font-weight:400;background:rgba(8,8,7,.5)}
.troupeMeta{display:inline-flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;
  color:var(--dim);font-size:11px;letter-spacing:.1em;
  background:rgba(8,7,6,.6);border:1px solid var(--line);border-radius:20px;
  padding:5px 16px;backdrop-filter:blur(3px)}
.troupeMeta b{color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px;
  letter-spacing:0;margin-left:5px}
.foot{margin:12px 0 0;color:var(--dim2);font-size:11px;display:flex;gap:12px;align-items:center;
      border-top:1px solid var(--line);padding-top:11px;flex-wrap:wrap}
.storyWrap{display:grid;grid-template-columns:224px 1fr;gap:16px;align-items:stretch;
  height:calc(100dvh - var(--hud-h) - var(--nav-h) - 30px);min-height:520px}
.chapRail{overflow:auto;padding:8px;border-radius:var(--r3);
  background:linear-gradient(168deg,var(--s2),var(--s1));
  border:1px solid var(--line2);box-shadow:var(--inset);
  scrollbar-width:thin}
.chapRail .railHead{font-size:10px;letter-spacing:.24em;font-weight:800;color:var(--gold3);
  padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.chapTab{display:block;width:100%;text-align:left;padding:9px 11px;margin-bottom:5px;
  border-radius:var(--r2);border:1px solid transparent;background:transparent;
  box-shadow:none;position:relative}
.chapTab:hover:not(:disabled){background:rgba(46,37,27,.5);border-color:var(--line2)}
.chapTab b{display:block;font-size:13px;font-weight:700}
.chapTab i{display:inline-grid;place-items:center;width:19px;height:19px;vertical-align:-4px;
  font-style:normal;color:var(--gold3);font-size:11px;font-weight:800;
  margin-right:7px;border:1px solid var(--line2);border-radius:5px;
  font-variant-numeric:tabular-nums}
.chapTab span{display:block;font-size:10px;color:var(--dim2);margin-top:2px;letter-spacing:.04em}
.chapTab.on{background:linear-gradient(90deg,rgba(216,174,87,.2),rgba(216,174,87,.04));
  border-color:var(--gold3);box-shadow:inset 2px 0 0 var(--gold)}
.chapTab.on b{color:var(--gold2)}
.chapTab.on i{color:var(--gold);border-color:var(--gold)}
.chapTab.on span{color:var(--gold3)}
.chapTab.clear i::after{content:' ✓';color:var(--green)}
.chapMain{display:flex;flex-direction:column;gap:14px;min-width:0}
.chapHead{position:relative;padding:18px 22px;border-radius:var(--r3);flex:none;
  display:flex;gap:22px;align-items:center;
  background:linear-gradient(110deg,var(--s3) 0%,var(--s1) 62%);
  border:1px solid var(--line2);box-shadow:var(--inset);overflow:hidden}
.chapHeadIn{flex:1;min-width:0}
.chapHead::after{content:attr(data-seal);position:absolute;right:222px;top:50%;
  transform:translateY(-50%);font-size:104px;font-weight:900;
  color:rgba(216,174,87,.07);letter-spacing:.06em;line-height:1;pointer-events:none}
.chapHero{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;
  align-items:center;gap:8px}
.chapHero .lab{color:var(--gold3)}
.chapEra{font-size:10.5px;letter-spacing:.24em;font-weight:800;color:var(--gold3)}
.chapHead h2{font-size:27px;letter-spacing:.06em;margin:4px 0 6px}
.chapHead p{margin:0;color:var(--dim);font-size:12.5px;max-width:62ch;line-height:1.7}
.chapStars{margin-top:10px;display:flex;gap:14px;align-items:center;font-size:11px;color:var(--dim2)}
.chapStars b{color:var(--gold);font-size:13px;letter-spacing:2px}
.nodes{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;align-content:stretch;min-height:0}
.node{position:relative;display:flex;flex-direction:column;text-align:left;
  padding:0;overflow:hidden;border-radius:var(--r3);color:var(--ink);
  min-height:230px;max-height:520px;
  background:linear-gradient(168deg,var(--s3),var(--s1));
  border:1px solid var(--line2);box-shadow:var(--inset),var(--lift);
  transition:transform .14s ease,border-color .14s,box-shadow .14s}
.node:hover:not(:disabled){transform:translateY(-4px);border-color:var(--gold);
  box-shadow:var(--inset),0 16px 40px rgba(0,0,0,.6),0 0 26px rgba(216,174,87,.18)}
.nBand{position:relative;flex:1;min-height:96px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  background:
    radial-gradient(75% 60% at 50% 46%,color-mix(in srgb,var(--c,#7f8a99) 22%,transparent) 0%,transparent 70%),
    radial-gradient(120% 130% at 50% 120%,#26303a 0%,#0e0d0b 72%);
  border-bottom:1px solid var(--line)}
.nSeal{font-size:52px;font-weight:900;line-height:1.1;letter-spacing:.14em;text-indent:.14em;
  color:var(--c,#8d97a3);opacity:.85;
  text-shadow:0 0 34px color-mix(in srgb,var(--c,#8d97a3) 55%,transparent),0 6px 22px rgba(0,0,0,.9)}
.nSealName{font-size:10px;letter-spacing:.28em;text-indent:.28em;font-weight:800;
  color:color-mix(in srgb,var(--c,#8d97a3) 78%,#fff);opacity:.75}
.nstars{position:absolute;top:10px;left:0;right:0;text-align:center;
  font-size:15px;color:var(--gold);letter-spacing:4px;
  text-shadow:0 0 12px rgba(216,174,87,.5)}
.nid{position:absolute;top:9px;left:12px;font-size:10px;color:var(--gold3);
  letter-spacing:.18em;font-weight:800}
.nBody{padding:11px 14px 13px;display:flex;flex-direction:column;gap:7px}
.nname{font-size:17px;font-weight:800;letter-spacing:.02em}
.nfoes{display:flex;flex-wrap:wrap;min-height:20px}
.npow{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim2);
  letter-spacing:.08em}
.npBar{flex:1;height:5px;border-radius:3px;background:#17120c;border:1px solid var(--line);
  overflow:hidden}

.pline>span{color:var(--gold3);font-size:10px;letter-spacing:.14em;font-weight:800;

.ok{color:var(--green)} .bad{color:var(--red)} .mid{color:var(--gold)}

#detail .mbox{max-width:640px;width:100%}

.dstats div{background:linear-gradient(180deg,rgba(46,37,27,.5),rgba(0,0,0,.35));

.dstats span{display:block;color:var(--dim2);font-size:9.5px;letter-spacing:.1em}
.dstats b{font-size:15px;font-variant-numeric:tabular-nums} .dstats b.gold{color:var(--gold)}
.dab{background:rgba(0,0,0,.3);border-left:3px solid var(--gold);border-radius:0 var(--r1) var(--r1) 0;

#result button{margin-top:20px;padding:11px 30px}
@media (max-width:1180px){

}

  .prepFoot{flex-wrap:wrap}
  .nodes{grid-template-columns:1fr 1fr}

    <div class="stage" id="stageWrap">
      <canvas id="troupe"></canvas>
      <div class="stagePlate"><b>본진</b><span id="plateSub">부대가 대기 중이다</span></div>
      <div class="stageOver">
        <div class="troupeNames" id="troupeNames"></div>
        <div class="troupeMeta" id="troupeMeta"></div>
      </div>
    </div>
  </div>
  <div class="foot">
    <span>보병 → 궁병 → 기병 → 보병 (1.5배 / 0.7배) · 책사는 상성 순환 밖</span>
    <span class="sp"></span>
    <button id="reset">처음부터</button>
  </div>
</div>


<div id="story" class="screen">
  <div class="storyWrap">
    <nav class="chapRail" id="chapTabs"></nav>
    <section class="chapMain">
      <header class="chapHead" id="chapHead"></header>
      <div class="nodes" id="nodes"></div>
    </section>
  </div>
</div>


<div id="codex" class="screen">
  <div class="codex">
    <div class="cxSide" id="cxSide"></div>
    <div class="cxMain">
      <div class="cxBar" id="cxBar"></div>
      <div class="grid" id="cxGrid"></div>
    </div>
  </div>
</div>


<div id="gacha" class="screen"><div id="gachaView"></div></div>


<div id="battle" class="screen">
  <div class="bwrap">
    <div class="bbar">
      <span id="bTitle"></span>
      <div class="bstat">
        <span id="bWave"></span><span id="bFoes"></span><span id="bAlive"></span><b id="bTime">0:00</b>
      </div>
    </div>
    <canvas id="stage" width="1000" height="420"></canvas>
    <div id="skills"></div>
    <div class="ctrl">
      <button id="autoSkill">스킬 수동</button>
      <span class="hint">숫자키 1~5로 발동</span>
      <span class="sp"></span>
      <button data-speed="1" class="on">1배</button>
      <button data-speed="2">2배</button>
      <button data-speed="4">4배</button>
      <button id="retreat">물러나기</button>
    </div>
  </div>
</div>

</div>


<nav class="nav" id="navBar" style="display:none"><div class="navIn" id="navIn"></div></nav>


<div id="prep" class="modal">
  <div class="mbox">
    <div id="prepTitle"></div>
    <p id="prepBrief"></p>
    <div id="prepBody"></div>
    <div class="prepFoot">
      <button id="prepGo" class="cta">출전</button>
      <button id="prepParty">진용</button>
      <button id="prepClose">닫기</button>
    </div>
  </div>
</div>


<div id="detail" class="modal">
  <div class="mbox">
    <div class="heroPanel row">
      <div class="hpCard" id="dCard"></div>
      <div class="hpBody" id="dBody"></div>
    </div>
    <button id="dClose" style="position:absolute;top:14px;right:16px;padding:4px 10px">닫기</button>
  </div>
</div>

<div id="result" class="modal">
  <div class="mbox">
    <h3 id="resTitle"></h3>
    <div id="resBody"></div>
    <div id="resHero"></div>
    <button id="resClose" class="cta">돌아가기</button>
  </div>
</div>

<script src="./game.f8efc875.js"></script>
</body>
</html>
